# =============================================================
# docker-compose.yml — menjalankan seluruh stack Team Profile Showcase
#   backend  : Python REST API (folder ./backend)
#   frontend : Nginx yang menyajikan ./frontend (Bind Mount)
#              dan meneruskan /api/... ke backend
# =============================================================

services:
  backend:
    build: ./backend                     # bangun image dari backend/Dockerfile
    image: team-portfolio-backend
    container_name: team-backend
    volumes:
      # NAMED VOLUME: data team_members.json tetap aman walau kontainer dihapus
      - team-profile-data:/var/lib/backend_data
    networks:
      - app-net
    # Port 5000 sengaja TIDAK dibuka ke laptop: backend cukup diakses Nginx
    # lewat nama service "backend" di jaringan app-net (lebih terisolasi).

  frontend:
    image: nginx:alpine
    container_name: team-frontend
    ports:
      - "8081:80"                        # buka di browser: http://localhost:8081
    volumes:
      # BIND MOUNT: isi folder ./frontend di laptop langsung dipakai Nginx,
      # jadi edit HTML/CSS/JS langsung terlihat tanpa rebuild image
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - app-net

volumes:
  team-profile-data:
    name: team-profile-data              # nama volume persis seperti di panduan

networks:
  app-net:
    name: app-net                        # Custom Bridge Network sesuai panduan
    driver: bridge