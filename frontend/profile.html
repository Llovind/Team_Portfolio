<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil anggota | Team Profile Showcase</title>

  <!-- Font & CSS sama dengan halaman lain supaya tampilannya padu -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">

  <!-- api.js dipakai bersama; profile.js khusus halaman ini -->
  <script src="js/api.js" defer></script>
  <script src="js/profile.js" defer></script>
</head>
<!-- class "page-enter" → halaman dibuka dalam keadaan redup lalu terang kembali -->
<body class="page-enter">

  <!-- ================= HEADER ================= -->
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="back-link" href="anggota.html">Kembali ke daftar tim</a>
    </div>
  </header>

  <main class="wrap profile">
    <!-- Pesan saat memuat / profil tidak ditemukan / backend mati -->
    <p class="profile-note" id="profileNote" role="status">Memuat profil…</p>

    <!-- Isi profil; disembunyikan (hidden) sampai datanya berhasil dimuat -->
    <article class="profile-body" id="profileBody" hidden>

      <!-- Bagian atas: foto/inisial, nama, peran, NIM -->
      <header class="profile-head">
        <div id="profileAvatar"></div>
        <div>
          <h1 class="profile-name" id="profileName"></h1>
          <p class="profile-role" id="profileRole"></p>
          <p class="profile-nim" id="profileNim"></p>
        </div>
      </header>

      <!-- <dl> = daftar "label : isi", cocok untuk data profil -->
      <dl class="profile-facts">
        <div class="fact">
          <dt>Tentang</dt>
          <dd id="profileBio"></dd>
        </div>
        <div class="fact">
          <dt>Keahlian</dt>
          <!-- Diisi profile.js: kelompok "Hard skill" dan "Soft skill" -->
          <dd class="skill-groups" id="profileSkills"></dd>
        </div>
        <div class="fact">
          <dt>Kontak</dt>
          <dd id="profileContact"></dd>
        </div>
      </dl>

      <!-- Hapus profil (DELETE /members?index=X) -->
      <section class="danger-zone">
        <h2>Hapus profil</h2>
        <p>Profil ini akan dihapus permanen dari data tim.</p>
        <button type="button" class="btn btn-danger" id="deleteBtn">Hapus profil ini</button>
        <p class="form-msg" id="deleteMsg" role="alert"></p>
      </section>
    </article>
  </main>

</body>
</html>
