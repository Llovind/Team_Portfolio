# Konfigurasi Nginx untuk service frontend
server {
    listen 80;
    server_name _;

    # Folder ini diisi lewat Bind Mount dari folder ./frontend di laptop/host
    root /usr/share/nginx/html;
    index index.html;

    # DNS internal Docker ada di 127.0.0.11.
    # Dengan resolver + variabel, Nginx menanyakan ulang IP "backend" tiap 10 detik.
    # Jadi waktu container backend dihapus lalu dibuat ulang (IP-nya bisa berubah,
    # misalnya saat simulasi Data Immunity), frontend tetap tersambung tanpa restart Nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:5000;

    # Halaman web (index.html)
    location / {
        try_files $uri $uri/ /index.html;
        # Jangan di-cache, supaya perubahan index.html (bind mount) langsung kelihatan
        add_header Cache-Control "no-store";
    }

    # Semua request /api/... diteruskan ke container backend
    # Contoh: /api/members?index=1  →  http://backend:5000/members?index=1
    location /api/ {
        # Izinkan unggahan foto kegiatan sampai 5 MB (bawaan Nginx hanya 1 MB)
        client_max_body_size 5m;

        rewrite ^/api/(.*)$ /$1 break;   # buang awalan /api (query ?index=... tetap ikut)
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}